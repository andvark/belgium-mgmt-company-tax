  div.ordinary_rate:
    value: 0.30
    status: owner_confirmed
    source: "ordinary dividends 30% (confirmed in owner checklist review)"
    hand_check: false
  div.vvprbis_rate:
    value: 0.18
    status: owner_confirmed
    source: "18% for qualifying dividends attributed or paid from 1 July 2026 (CIR 92 art. 269 par. 2, 2026 programme law; confirmed in owner checklist review). Eligibility: see vvprbis.* and asm.vvprbis_eligible"
    hand_check: false
  lr.levy_rate:
    value: 0.10
    status: owner_confirmed
    source: "separate levy of 10% of the amount CREDITED to the reserve (confirmed in owner checklist review). From EUR 110 available after ordinary corporate tax: credit 100, pay 10 up front"
    hand_check: false
  lr.dividend_withholding:
    value: 0.098
    status: owner_confirmed
    source: "9.8% withholding on the qualifying dividend, applied to the credited amount; reserves constituted from 31 December 2025, effective 11 June 2026 (2026 programme law arts. 15-18; confirmed in owner checklist review). Total on the dividend route 19.80/110 = 18.00%; at liquidation 10/110 = 9.09%"
    hand_check: false
    note: "RESOLVED: the total is 18.00%, not 18.82%; reserve credited = available / 1.10"
  lr.lock_years:
    value: 3
    status: owner_confirmed
    source: "three full years from the last day of the taxable period in which the reserve was constituted (2025 programme law art. 33; confirmed in owner checklist review)"
    hand_check: false
  lr.lock_extra_calendar_years:
    value: 1
    status: owner_confirmed
    source: "for a 31 December 2026 close the first ordinary payment year at 9.8% is 2030, i.e. a calendar-year model that books the dividend in its payment year uses 1 (confirmed in owner checklist review). Early distributions of new vintages generally attract 30% (the model does not pay them early)"
    hand_check: false
    note: "was 0 (my earlier reading); date-based modelling could use actual dates"
  lr.liquidation_extra_withholding:
    value: 0.0
    status: owner_confirmed
    source: "qualifying liquidation-reserve payouts on actual liquidation are exempt at payout, the levy having been paid (CIR 92 art. 269; confirmed in owner checklist review)"
    hand_check: false
  lr.anti_abuse_rate:
    value: 0.30
    status: open
    source: "2026 anti-abuse rule: the payout can become taxable as movable income in the LATER year when the recipient becomes director of a same or similar business within three years, subject to rebuttal (2026 programme law arts. 13-18). Checklist review: 30% is a reasonable ordinary-rate scenario, but the model books it at liquidation and so misses the timing"
    hand_check: true
  liq.ordinary_rate:
    value: 0.30
    status: owner_confirmed
    source: "ordinary taxable liquidation surplus generally 30% (confirmed in owner checklist review)"
    hand_check: false
  vvprbis.wait_years_after_contribution_year:
    value: 3
    status: owner_confirmed
    source: "the 18% VVPRbis rate starts with the profit distribution for the THIRD accounting year following the contribution year; earlier profits bear 30% (CIR 92 art. 269 par. 2, 2026 programme law; confirmed in owner checklist review). The 20% second-year step survives only for qualifying contributions through 31 December 2025. Eligibility also needs a company small at the time of contribution, new registered shares issued from 1 July 2013 for fully paid new cash contributions, continuous full ownership and no preferential economic rights"
    hand_check: false
    note: "profit of year t is VVPRbis-eligible if t >= contribution year + 3; the contribution year is the company's first taxable-period year"
