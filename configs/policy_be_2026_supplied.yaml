    status: supplied
    source: "director remuneration >= EUR 51,000 (indexed from 45,000), calendar-year company (via project owner)"
    hand_check: true
  corp.pay_test_covers_profit:
    value: true
    status: interpretation
    source: "'lower pay can qualify if it covers taxable profit'. READING: condition is pay >= min(51,000, taxable profit BEFORE deducting the director's pay)"
    hand_check: true
  corp.pay_test_first_exempt_periods:
    value: 4
    status: interpretation
    source: "'test starts in the fifth taxable period'. READING: taxable periods 1-4 are exempt from the pay condition"
