    hand_check: true
  lr.dividend_withholding:
    value: 0.098
    status: supplied
    source: "liquidation reserve distributed as dividend after the wait: 9.8% withholding (via project owner)"
    note: "INTERPRETATION of the total: reserve account = allocation minus 10% levy; 9.8% applies to what is distributed => 10% + 0.9 x 9.8% = 18.82%, whereas the owner states 'effective 18%'. Sensitivity: set to 0.08889 for a total of exactly 18%."
    hand_check: true
  lr.lock_years:
    value: 3
    status: supplied
    source: "three-year wait before dividend distribution (via project owner)"
    hand_check: true
  lr.lock_extra_calendar_years:
