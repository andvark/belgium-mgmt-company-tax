# Belgian rules for income earned in 2026 (assessment year 2027), AS SUPPLIED BY THE PROJECT OWNER on 15 Nov 2026.
# None has been independently confirmed: the primary pages (fin.belgium.be, economie.fgov.be, socialsecurity.be)
# could not be opened from the research sessions (anti-bot challenge / 404).  Nothing here is "checked".
#
# status:
#   supplied        value given by the owner with an official citation; primary page not confirmed by us
#   interpretation  wording supplied by the owner is ambiguous; value is OUR READING of it (see note)
#   open            input genuinely missing; value is a DEFAULT chosen so that the engine can run (see note)
#   scenario        negotiating position / assumption, not law (used from WP2 on)
# hand_check: true = please confirm against the primary source (listed in docs/hand_check_list.md)
name: be_2026_supplied
policy_year: 2026
banner: "RULES SUPPLIED BY THE PROJECT OWNER, NOT INDEPENDENTLY CONFIRMED AGAINST PRIMARY SOURCES. Draft proposals are not law."
rules:
