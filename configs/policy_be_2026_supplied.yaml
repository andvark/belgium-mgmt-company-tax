    value: 51000
    status: owner_confirmed
    source: "EUR 51,000, indexed threshold for assessment year 2027 (July 2026 law art. 80, August indexation notice; confirmed in owner checklist review)"
    hand_check: false
  corp.pay_test_covers_profit:
    value: true
    status: owner_confirmed
    source: "below EUR 51,000, director pay must at least equal the company's taxable income AFTER deducting that pay (CIR 92 art. 145/26; confirmed in owner checklist review). Example: EUR 60,000 before pay and pay 30,000 leaves 30,000 taxable and qualifies. This corrects the earlier reading, which tested pay against profit BEFORE pay"
    hand_check: false
    note: "qualifies if pay >= 51,000 or pay >= profit before pay - pay; cheapest qualifying pay = min(51,000, profit before pay / 2)"
  corp.pay_test_first_exempt_periods:
    value: 4
    status: owner_confirmed
    source: "taxable periods 1-4 are exempt from the remuneration test (confirmed in owner checklist review; a continuation of an existing activity can inherit an earlier deemed start date, not modelled)"
    hand_check: false
  corp.dividend_capital_condition:
    value: false
    status: owner_confirmed
    source: "the old 13% dividend-to-paid-up-capital limit was repealed by the 2017 corporate-tax reform (art. 54); confirmed in owner checklist review. A separate rule from assessment year 2027 can deny the reduced rate when flat-valued benefits in kind exceed 20% of total director remuneration (not modelled)"
    hand_check: false
    note: "keep false"
  corp.annual_company_contribution:
    value: 409.30
    status: owner_confirmed
    source: "EUR 409.30 for 2024 balance-sheet total up to EUR 879,163.44, EUR 1,022.38 above (INASTI; confirmed in owner checklist review). Qualifying start-ups can receive a three-year exemption (not modelled; EUR 409 a year)"
    hand_check: false
